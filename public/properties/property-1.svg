<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="facadeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="woodGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C29B78"/>
      <stop offset="100%" stop-color="#8C6544"/>
    </linearGradient>
    <linearGradient id="glassGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- Background sky -->
  <rect width="800" height="500" fill="url(#skyGrad1)"/>
  
  <!-- Subtle architectural grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Pavement / Ground -->
  <rect x="0" y="420" width="800" height="80" fill="#0F172A"/>
  <rect x="0" y="420" width="800" height="4" fill="#14B8A6" fill-opacity="0.4"/>

  <!-- Main Building Block -->
  <rect x="180" y="140" width="440" height="280" rx="4" fill="url(#facadeGrad1)" stroke="#CBD5E1" stroke-width="1.5"/>
  
  <!-- Modern Cantilever Roof / Canopy -->
  <polygon points="160,140 640,140 620,118 180,118" fill="#0F172A"/>
  <rect x="150" y="136" width="500" height="6" fill="#14B8A6"/>

  <!-- Left Accent Timber Siding -->
  <rect x="200" y="156" width="100" height="248" fill="url(#woodGrad1)"/>
  <g stroke="#65442A" stroke-width="1.5">
    <line x1="200" y1="180" x2="300" y2="180"/>
    <line x1="200" y1="204" x2="300" y2="204"/>
    <line x1="200" y1="228" x2="300" y2="228"/>
    <line x1="200" y1="252" x2="300" y2="252"/>
    <line x1="200" y1="276" x2="300" y2="276"/>
    <line x1="200" y1="300" x2="300" y2="300"/>
    <line x1="200" y1="324" x2="300" y2="324"/>
    <line x1="200" y1="348" x2="300" y2="348"/>
    <line x1="200" y1="372" x2="300" y2="372"/>
  </g>

  <!-- Level 2 Floor Line -->
  <rect x="300" y="270" width="320" height="8" fill="#334155"/>

  <!-- Windows Floor 2 -->
  <rect x="330" y="170" width="70" height="80" rx="2" fill="url(#glassGrad1)" stroke="#1E293B" stroke-width="3"/>
  <rect x="430" y="170" width="70" height="80" rx="2" fill="url(#glassGrad1)" stroke="#1E293B" stroke-width="3"/>
  <rect x="530" y="170" width="70" height="80" rx="2" fill="url(#glassGrad1)" stroke="#1E293B" stroke-width="3"/>

  <!-- Balcony Railings Floor 2 -->
  <rect x="320" y="235" width="290" height="2" fill="#0F172A"/>
  <rect x="320" y="248" width="290" height="2" fill="#0F172A"/>
  <g stroke="#0F172A" stroke-width="1.5">
    <line x1="340" y1="235" x2="340" y2="260"/>
    <line x1="370" y1="235" x2="370" y2="260"/>
    <line x1="400" y1="235" x2="400" y2="260"/>
    <line x1="430" y1="235" x2="430" y2="260"/>
    <line x1="460" y1="235" x2="460" y2="260"/>
    <line x1="490" y1="235" x2="490" y2="260"/>
    <line x1="520" y1="235" x2="520" y2="260"/>
    <line x1="550" y1="235" x2="550" y2="260"/>
    <line x1="580" y1="235" x2="580" y2="260"/>
  </g>

  <!-- Floor 1 Windows & Entry -->
  <rect x="330" y="300" width="70" height="90" rx="2" fill="url(#glassGrad1)" stroke="#1E293B" stroke-width="3"/>
  <rect x="430" y="300" width="70" height="90" rx="2" fill="url(#glassGrad1)" stroke="#1E293B" stroke-width="3"/>
  <!-- Modern Main Entrance Door -->
  <rect x="535" y="295" width="60" height="125" fill="#0F172A" stroke="#14B8A6" stroke-width="2"/>
  <circle cx="585" cy="360" r="3" fill="#F8FAFC"/>

  <!-- Aesthetic Plant & Tree Silhouettes -->
  <path d="M 120 420 C 110 370, 140 340, 150 420 Z" fill="#064E3B" fill-opacity="0.8"/>
  <path d="M 140 420 C 130 350, 170 330, 180 420 Z" fill="#065F46"/>
  <path d="M 640 420 C 630 360, 680 340, 690 420 Z" fill="#064E3B" fill-opacity="0.8"/>

  <!-- Elegant Property Typography Label Badge -->
  <rect x="24" y="24" width="140" height="32" rx="16" fill="#0F172A" fill-opacity="0.7" stroke="#14B8A6" stroke-width="1"/>
  <circle cx="40" cy="40" r="4" fill="#14B8A6"/>
  <text x="52" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC" letter-spacing="0.5">SEWALOKAL</text>
</svg>
