<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="concreteGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="nightGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyGrad2)"/>

  <!-- Pavement / Lawn -->
  <rect x="0" y="410" width="800" height="90" fill="#0A0F1D"/>
  <rect x="0" y="410" width="800" height="5" fill="#0D9488"/>

  <!-- Main 3-story Building Structure -->
  <rect x="140" y="110" width="520" height="300" rx="4" fill="url(#concreteGrad2)" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Rooftop Garden Pergola Structure -->
  <rect x="160" y="90" width="220" height="20" fill="#1E293B"/>
  <g stroke="#334155" stroke-width="2">
    <line x1="180" y1="90" x2="180" y2="110"/>
    <line x1="210" y1="90" x2="210" y2="110"/>
    <line x1="240" y1="90" x2="240" y2="110"/>
    <line x1="270" y1="90" x2="270" y2="110"/>
    <line x1="300" y1="90" x2="300" y2="110"/>
    <line x1="330" y1="90" x2="330" y2="110"/>
    <line x1="360" y1="90" x2="360" y2="110"/>
  </g>

  <!-- Left Architectural Brick Feature -->
  <rect x="140" y="110" width="130" height="300" fill="url(#terracottaGrad)"/>
  <!-- Brick Texture -->
  <g stroke="#78350F" stroke-width="1" stroke-opacity="0.4">
    <line x1="140" y1="140" x2="270" y2="140"/>
    <line x1="140" y1="170" x2="270" y2="170"/>
    <line x1="140" y1="200" x2="270" y2="200"/>
    <line x1="140" y1="230" x2="270" y2="230"/>
    <line x1="140" y1="260" x2="270" y2="260"/>
    <line x1="140" y1="290" x2="270" y2="290"/>
    <line x1="140" y1="320" x2="270" y2="320"/>
    <line x1="140" y1="350" x2="270" y2="350"/>
    <line x1="140" y1="380" x2="270" y2="380"/>
  </g>

  <!-- Floor 3 Windows -->
  <rect x="300" y="135" width="85" height="60" rx="3" fill="url(#nightGlassGrad)" stroke="#1E293B" stroke-width="3"/>
  <rect x="420" y="135" width="85" height="60" rx="3" fill="url(#nightGlassGrad)" stroke="#1E293B" stroke-width="3"/>
  <rect x="540" y="135" width="85" height="60" rx="3" fill="url(#nightGlassGrad)" stroke="#1E293B" stroke-width="3"/>

  <!-- Floor 2 Windows & Cantilever Planter -->
  <rect x="300" y="225" width="85" height="60" rx="3" fill="url(#nightGlassGrad)" stroke="#1E293B" stroke-width="3"/>
  <rect x="420" y="225" width="85" height="60" rx="3" fill="url(#nightGlassGrad)" stroke="#1E293B" stroke-width="3"/>
  <rect x="540" y="225" width="85" height="60" rx="3" fill="url(#nightGlassGrad)" stroke="#1E293B" stroke-width="3"/>

  <!-- Planter box floor 2 -->
  <rect x="290" y="285" width="350" height="10" fill="#0F172A"/>
  <path d="M 310 285 Q 330 270 350 285 Q 370 270 390 285 Q 410 270 430 285" stroke="#10B981" stroke-width="6" fill="none"/>

  <!-- Ground Floor: Glass lobby & Entry -->
  <rect x="300" y="315" width="200" height="95" fill="url(#nightGlassGrad)" stroke="#1E293B" stroke-width="3"/>
  <!-- Canopy Entry -->
  <rect x="515" y="325" width="120" height="85" fill="#0F172A"/>
  <rect x="540" y="340" width="70" height="70" fill="url(#nightGlassGrad)" stroke="#0D9488" stroke-width="2"/>

  <!-- Decorative Modern Lighting Posts -->
  <line x1="80" y1="410" x2="80" y2="330" stroke="#64748B" stroke-width="3"/>
  <circle cx="80" cy="330" r="8" fill="#FDE047"/>
  <circle cx="80" cy="330" r="18" fill="#FDE047" fill-opacity="0.2"/>

  <line x1="720" y1="410" x2="720" y2="330" stroke="#64748B" stroke-width="3"/>
  <circle cx="720" cy="330" r="8" fill="#FDE047"/>
  <circle cx="720" cy="330" r="18" fill="#FDE047" fill-opacity="0.2"/>
</svg>
